<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0D0D0D; height: 100%; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  #canvas { position: fixed; inset: 0; display: flex; overflow: auto; padding: 24px; }
  .info { position: fixed; top: 0; left: 0; z-index: 99; color: #bbb; font-size: 12px;
          background: rgba(0,0,0,.75); padding: 6px 10px; border-radius: 0 0 6px 0; }

  .device-stage { position: relative; margin: auto; flex-shrink: 0; isolation: isolate; }
  .device-screen-clip { position: absolute; z-index: 1; }
  .device-screen-mask { position: absolute; inset: 0; overflow: hidden; background: #fff; }
  .device-screen { position: absolute; left: 0; top: 0; border: none; background: #fff; display: block; overflow: hidden; }
  .device-frame { position: absolute; z-index: 2; left: 0; top: 0; pointer-events: none; user-select: none; }
  .calib-dot { position: fixed; width: 7px; height: 7px; background: #FF00FF; border-radius: 50%; z-index: 999; pointer-events: none; }

  /* 验收用正文：白色底 + 灰条，方便观察边缘贴合 */
  .verify-body { padding: 24px 16px 60px; }
  .verify-title { font-size: 22px; font-weight: 700; color: #111; margin: 0 0 16px; }
  .verify-account { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
  .verify-avatar { width: 38px; height: 38px; border-radius: 6px; background: linear-gradient(135deg,#10B981,#059669); flex-shrink: 0; }
  .verify-line { height: 11px; border-radius: 4px; background: #E5E5E5; margin: 0 0 12px; }
</style>

const id = new URLSearchParams(location.search).get('id') || DEVICES[0].id;
const dev = DEVICES.find(d => d.id === id) || DEVICES[0];

function layout(dev, cw, ch, pad) {
  const [fw, fh] = dev.frameSize, [sx, sy, sw, sh] = dev.screen;
  const availW = Math.max(80, cw - pad * 2), availH = Math.max(80, ch - pad * 2);
  const fit = Math.min(availW / fw, availH / fh);
  const scale = fit;
  return {
    frameWidth: fw * scale, frameHeight: fh * scale,
    screenLeft: sx * scale, screenTop: sy * scale,
    screenWidth: sw * scale, screenHeight: sh * scale,
    contentScale: (sw * scale) / dev.width,
    radius: (dev.radius * fw * scale) / fw,
  };
}

const canvas = document.getElementById('canvas');
const info = document.getElementById('info');

function render() {
  const cw = window.innerWidth, ch = window.innerHeight;
  const L = layout(dev, cw, ch, 24);
  const body = dev.bodyColor;
  const radiusPx = L.radius;

  const stage = document.createElement('div');
  stage.className = 'device-stage';
  stage.style.width = L.frameWidth + 'px';
  stage.style.height = L.frameHeight + 'px';

  const clip = document.createElement('div');
  clip.className = 'device-screen-clip';
  clip.style.cssText = `left:${L.screenLeft}px;top:${L.screenTop}px;width:${L.screenWidth}px;height:${L.screenHeight}px;background:rgb(${body[0]},${body[1]},${body[2]});`;

  const mask = document.createElement('div');
  mask.className = 'device-screen-mask';
  mask.style.cssText = `border-radius:${radiusPx.toFixed(2)}px;clip-path:inset(0 round ${radiusPx.toFixed(2)}px);`;

  const frameEl = document.createElement('iframe');
  frameEl.className = 'device-screen';
  frameEl.style.cssText = `width:${dev.width}px;height:${dev.height}px;transform:scale(${L.contentScale});transform-origin:top left;`;
  frameEl.sandbox = 'allow-same-origin';
  frameEl.srcdoc = `<!DOCTYPE html><html><head><style>
    html,body{margin:0;padding:0;background:#fff;overflow-x:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
    img{max-width:100%}table{border-collapse:collapse}
    .verify-body{padding:24px 16px 60px}
    .verify-title{font-size:22px;font-weight:700;color:#111;margin:0 0 16px}
    .verify-account{display:flex;gap:10px;align-items:center;margin-bottom:20px}
    .verify-avatar{width:38px;height:38px;border-radius:6px;background:linear-gradient(135deg,#10B981,#059669);flex-shrink:0}
    .verify-line{height:11px;border-radius:4px;background:#E5E5E5;margin:0 0 12px}
  </style></head><body>
  <div class="verify-body">
    <div class="verify-title">图形验证码 · 自动化通关指南</div>
    <div class="verify-account"><div class="verify-avatar"></div></div>
    <div class="verify-line" style="width:96%"></div>
    <div class="verify-line" style="width:88%"></div>
    <div class="verify-line" style="width:93%"></div>
    <div class="verify-line" style="width:70%"></div>
    <div class="verify-line" style="width:97%"></div>
    <div class="verify-line" style="width:82%"></div>
    <div class="verify-line" style="width:90%"></div>
  </div></body></html>`;

  const img = document.createElement('img');
  img.className = 'device-frame';
  img.src = dev.frame;
  img.alt = dev.name;
  img.draggable = false;
  img.style.cssText = `width:${L.frameWidth}px;height:${L.frameHeight}px;`;

  mask.appendChild(frameEl);
  clip.appendChild(mask);
  stage.appendChild(clip);
  stage.appendChild(img);
  canvas.innerHTML = '';
  canvas.appendChild(stage);

  info.textContent = `${dev.name}  ${dev.width}x${dev.height}  bodyColor=rgb(${body[0]},${body[1]},${body[2]})  scale=${Math.round(L.contentScale * 100)}%  fit=${(L.frameWidth / dev.frameSize[0]).toFixed(3)}  vw=${window.innerWidth} vh=${window.innerHeight}`;

  // 校准模式：?calib=1 时在开口矩形四角画洋红圆点，用于截图后像素级定位开口
  document.querySelectorAll('.calib-dot').forEach(el => el.remove());
  if (new URLSearchParams(location.search).get('calib') === '1') {
    const r = clip.getBoundingClientRect();
    const pts = [
      [r.left, r.top],
      [r.right, r.top],
      [r.left, r.bottom],
      [r.right, r.bottom],
    ];
    for (const [x, y] of pts) {
      const dot = document.createElement('div');
      dot.className = 'calib-dot';
      dot.style.left = (x - 3) + 'px';
      dot.style.top = (y - 3) + 'px';
      document.body.appendChild(dot);
    }
  }
}

window.addEventListener('resize', render);
render();
</script>
